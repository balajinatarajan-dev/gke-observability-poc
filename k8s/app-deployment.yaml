apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-a
spec:
  replicas: 3
  selector:
    matchLabels: {app: web-app-a}
  template:
    metadata:
      labels: {app: web-app-a}
    spec:
      containers:
      - name: web-app-a
        image: gcr.io/google-samples/hello-app:2.0
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: "100m", memory: "64Mi"}
          limits: {cpu: "250m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-a-svc
spec:
  type: LoadBalancer
  selector: {app: web-app-a}
  ports: [{port: 80, targetPort: 8080}]
